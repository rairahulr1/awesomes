name: Deploy VitePress Site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages is served from the gh-pages branch, pushed by this workflow.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress
        run: npm run build

      - name: Skip Jekyll on the published tree
        run: touch docs/.vitepress/dist/.nojekyll

      # Plain git rather than a third-party publish action: the deploy-pages API was
      # returning 404s for this repo, and a force-pushed branch needs no extra dependency.
      - name: Publish to gh-pages
        run: |
          cd docs/.vitepress/dist
          git init -q
          # Identity must be set here, not in the parent repo: git init creates a fresh
          # repository that does not inherit the checkout's local config.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -qB gh-pages
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages